<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Nuxo — Prospect CRM</title>
<meta name="description" content="Track contacts, companies, and your sales pipeline, without the lag of a traditional CRM." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/tokens.css?v=3" />
<link rel="stylesheet" href="css/base.css?v=3" />
<link rel="stylesheet" href="css/layout.css?v=3" />
<link rel="stylesheet" href="css/components.css?v=3" />
<link rel="stylesheet" href="css/views.css?v=10" />
</head>
<body>

<!-- AUTH GATE -->
<div id="auth-screen" class="auth-screen">
  <div class="auth-card">
    <div class="auth-logo">
      <span class="auth-logo-word">Nuxo</span>
    </div>
    <p class="auth-tag">Your contact pipeline, clear and fast.</p>
    <div id="auth-error" class="auth-error" hidden></div>
    <form id="auth-form" class="auth-form">
      <input id="auth-email" type="email" placeholder="you@email.com" autocomplete="email" required />
      <input id="auth-password" type="password" placeholder="Password" autocomplete="current-password" required minlength="6" />
      <button type="submit" id="auth-submit" class="btn btn-primary btn-block">Sign In</button>
    </form>
    <button id="auth-toggle-mode" class="auth-link">First time here? Create an account</button>
    <div id="auth-loading" class="auth-loading" hidden>Connecting…</div>
  </div>
</div>

<!-- APP SHELL -->
<div id="app" class="app" hidden>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <div class="brand">
        <span class="brand-word">Nuxo</span>
      </div>
      <button id="new-btn" class="new-btn" title="New Contact (N)">
        <span class="plus">+</span> New Contact
      </button>
    </div>

    <nav class="nav" id="main-nav">
      <button class="nav-item" data-view="dashboard">
        <span class="nav-icon">📊</span><span>Dashboard</span>
      </button>
      <button class="nav-item" data-view="pipeline">
        <span class="nav-icon">🗂</span><span>Pipeline</span><span class="nav-count" id="count-pipeline">0</span>
      </button>
      <button class="nav-item" data-view="contacts">
        <span class="nav-icon">👤</span><span>Contacts</span><span class="nav-count" id="count-contacts">0</span>
      </button>
      <button class="nav-item" data-view="companies">
        <span class="nav-icon">🏢</span><span>Companies</span><span class="nav-count" id="count-companies">0</span>
      </button>
      <button class="nav-item" data-view="tasks">
        <span class="nav-icon">✅</span><span>Tasks</span><span class="nav-count" id="count-tasks">0</span>
      </button>
    </nav>

    <div class="sidebar-bottom">
      <button id="theme-toggle" class="icon-btn" title="Toggle theme">🌙</button>
      <button id="logout-btn" class="icon-btn" title="Sign out">⏻</button>
    </div>
  </aside>

  <main class="main" id="main-content">
    <header class="topbar">
      <button id="mobile-nav-toggle" class="mobile-nav-toggle">☰</button>
      <h1 id="view-title" class="view-title">Dashboard</h1>
      <div class="topbar-search" id="topbar-search-wrap" hidden>
        <input id="search-input" type="text" placeholder="Search… (/)" />
      </div>
    </header>

    <div class="view-body" id="view-body">
      <!-- rendered by JS -->
    </div>
  </main>

  <div id="mobile-nav-overlay" class="mobile-nav-overlay" hidden></div>
</div>

<!-- NEW CONTACT DRAWER -->
<div id="contact-drawer" class="drawer" hidden>
  <div class="drawer-backdrop" id="contact-drawer-backdrop"></div>
  <div class="drawer-panel">
    <form id="contact-form" class="entity-form">
      <div class="field-grid">
        <div class="field-row">
          <label>First Name</label>
          <input id="new-contact-first-name" type="text" placeholder="First name" required />
        </div>
        <div class="field-row">
          <label>Last Name</label>
          <input id="new-contact-last-name" type="text" placeholder="Last name" />
        </div>
      </div>

      <div class="field-grid">
        <div class="field-row">
          <label>Email</label>
          <input id="new-contact-email" type="email" placeholder="email@example.com" />
        </div>
        <div class="field-row">
          <label>Phone</label>
          <input id="new-contact-phone" type="tel" placeholder="+1 …" />
        </div>
      </div>

      <div class="field-grid">
        <div class="field-row">
          <label>Mobile</label>
          <input id="new-contact-mobile" type="tel" placeholder="+1 …" />
        </div>
        <div class="field-row">
          <label>WhatsApp</label>
          <input id="new-contact-whatsapp" type="tel" placeholder="+1 …" />
        </div>
      </div>

      <div class="field-grid">
        <div class="field-row">
          <label>Estimated Value</label>
          <input id="new-contact-value" type="number" min="0" placeholder="0" />
        </div>
        <div class="field-row">
          <label>Stage</label>
          <select id="new-contact-stage"></select>
        </div>
      </div>

      <div class="field-row">
        <label>Source</label>
        <select id="new-contact-source">
          <option value="">— Select —</option>
          <option>Advertisement</option>
          <option>Chat</option>
          <option>Cold Call</option>
          <option>Email Campaign</option>
          <option>Employee Referral</option>
          <option>Existing Customer</option>
          <option>Facebook</option>
          <option>Google Ads</option>
          <option>Instagram</option>
          <option>LinkedIn</option>
          <option>Organic Search</option>
          <option>Partner</option>
          <option>Public Relations</option>
          <option>Referral</option>
          <option>Trade Show</option>
          <option>Walk-In</option>
          <option>Web Download</option>
          <option>Web Research</option>
          <option>Website</option>
          <option>Other</option>
        </select>
      </div>

      <div class="field-grid">
        <div class="field-row">
          <label>Street</label>
          <input id="new-contact-street" type="text" placeholder="Street address" />
        </div>
        <div class="field-row">
          <label>Street 2</label>
          <input id="new-contact-street2" type="text" placeholder="Apt, suite, etc." />
        </div>
      </div>

      <div class="field-grid">
        <div class="field-row">
          <label>City</label>
          <input id="new-contact-city" type="text" placeholder="City" />
        </div>
        <div class="field-row">
          <label>State</label>
          <input id="new-contact-state" type="text" placeholder="State" />
        </div>
      </div>

      <div class="field-grid">
        <div class="field-row">
          <label>Postal Code</label>
          <input id="new-contact-postal-code" type="text" placeholder="Postal code" />
        </div>
        <div class="field-row">
          <label>Country</label>
          <input id="new-contact-country" type="text" placeholder="Country" />
        </div>
      </div>

      <div class="drawer-actions">
        <div></div>
        <div class="drawer-actions-right">
          <button type="button" id="contact-cancel" class="btn btn-ghost">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </div>
    </form>
  </div>
</div>

<!-- NEW COMPANY MODAL -->
<div id="company-modal" class="modal" hidden>
  <div class="modal-backdrop" id="company-modal-backdrop"></div>
  <div class="modal-panel modal-panel-wide">
    <h2>New Company</h2>
    <form id="company-form">
      <div class="field-row">
        <label>Company Name</label>
        <input id="new-company-name" type="text" placeholder="Company name" required />
      </div>
      <div class="field-grid">
        <div class="field-row">
          <label>Website</label>
          <input id="new-company-website" type="text" placeholder="example.com" />
        </div>
        <div class="field-row">
          <label>Email</label>
          <input id="new-company-email" type="email" placeholder="hello@example.com" />
        </div>
      </div>
      <div class="field-grid">
        <div class="field-row">
          <label>Phone</label>
          <input id="new-company-phone" type="tel" placeholder="+1 …" />
        </div>
        <div class="field-row">
          <label>WhatsApp</label>
          <input id="new-company-whatsapp" type="tel" placeholder="+1 …" />
        </div>
      </div>
      <div class="field-grid">
        <div class="field-row">
          <label>Industry</label>
          <select id="new-company-industry">
            <option value="">— Select —</option>
            <option>Agriculture</option>
            <option>Apparel &amp; Accessories</option>
            <option>Automotive</option>
            <option>Banking</option>
            <option>Biotechnology</option>
            <option>Chemicals</option>
            <option>Communications</option>
            <option>Construction</option>
            <option>Consulting</option>
            <option>Education</option>
            <option>Electronics</option>
            <option>Energy</option>
            <option>Engineering</option>
            <option>Entertainment &amp; Leisure</option>
            <option>Finance</option>
            <option>Food &amp; Beverage</option>
            <option>Government</option>
            <option>Health &amp; Beauty</option>
            <option>Healthcare</option>
            <option>Hospitality</option>
            <option>Insurance</option>
            <option>Legal</option>
            <option>Manufacturing</option>
            <option>Media</option>
            <option>Non-Profit</option>
            <option>Real Estate</option>
            <option>Recreation</option>
            <option>Retail</option>
            <option>Shipping &amp; Transportation</option>
            <option>Technology</option>
            <option>Telecommunications</option>
            <option>Utilities</option>
            <option>Other</option>
          </select>
        </div>
        <div class="field-row">
          <label>Facebook</label>
          <input id="new-company-facebook" type="text" placeholder="Profile or page" />
        </div>
      </div>
      <div class="field-grid">
        <div class="field-row">
          <label>Instagram</label>
          <input id="new-company-instagram" type="text" placeholder="@handle" />
        </div>
        <div class="field-row">
          <label>Street</label>
          <input id="new-company-street" type="text" placeholder="Street address" />
        </div>
      </div>
      <div class="field-grid">
        <div class="field-row">
          <label>Street 2</label>
          <input id="new-company-street2" type="text" placeholder="Apt, suite, etc." />
        </div>
        <div class="field-row">
          <label>City</label>
          <input id="new-company-city" type="text" placeholder="City" />
        </div>
      </div>
      <div class="field-grid">
        <div class="field-row">
          <label>State</label>
          <input id="new-company-state" type="text" placeholder="State" />
        </div>
        <div class="field-row">
          <label>Postal Code</label>
          <input id="new-company-postal-code" type="text" placeholder="Postal code" />
        </div>
      </div>
      <div class="field-row">
        <label>Country</label>
        <input id="new-company-country" type="text" placeholder="Country" />
      </div>
      <div class="modal-actions">
        <button type="button" id="company-cancel" class="btn btn-ghost">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Company</button>
      </div>
    </form>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script type="module" src="js/firebase-config.js?v=1"></script>
<script type="module" src="js/app.js?v=20"></script>
</body>
</html>
